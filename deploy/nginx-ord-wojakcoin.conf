# WojakCoin ord explorer — ord.wojakcoin.cash & ord.wojakcoin2017.xyz
# Proxies to ordwoj on 127.0.0.1:3080
#
# Install:
#   sudo cp /root/ord-wojakcoin/deploy/nginx-ord-wojakcoin.conf /etc/nginx/sites-available/ord-wojakcoin
#   sudo ln -sf /etc/nginx/sites-available/ord-wojakcoin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (after HTTP works):
#   sudo certbot --nginx -d ord.wojakcoin.cash -d ord.wojakcoin2017.xyz

server {
    listen 80;
    listen [::]:80;
    server_name ord.wojakcoin.cash ord.wojakcoin2017.xyz;

    include snippets/bot-block.conf;

    location /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }
}
